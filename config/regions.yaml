# Regions for the correlated-error term. Each town (or whole city) is assigned to one region;
# a district takes the region where most of its 2024 presidential votes were cast.
# Unlisted towns default by county (see county_default).
county_default:
  Coos: north_country
  Grafton: upper_valley          # overridden below for the northern Grafton towns
  Carroll: lakes
  Belknap: lakes
  Strafford: seacoast
  Rockingham: seacoast           # overridden below for the Massachusetts-border towns
  Hillsborough: monadnock        # overridden below for Manchester, Nashua and the border towns
  Merrimack: concord_merrimack
  Sullivan: upper_valley
  Cheshire: monadnock
